# 推送到 main → 测试 → 构建 → 发布到 GitHub Pages(2026-07-17 爸爸定的部署方案)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 全屏视觉层守卫由 npm run build 内部执行;任务文档的视觉引用门禁(check:visual-references)
      # 自 2026-09-11 起只在美术任务前手动运行,不再决定生产部署成败(F4-CHG-035)。
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
