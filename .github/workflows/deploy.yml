# 推送到 main → 测试 → 构建 → 发布到 GitHub Pages(2026-07-17 爸爸定的部署方案)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 门禁先跑:任务门禁文档或全屏视觉层违规时快速失败,不浪费测试与构建时间。
      # npm run build 内部会再跑一次同样的检查,保证本地构建与 CI 行为一致。
      - name: 门禁检查(全屏视觉层 + 任务视觉引用)
        run: npm run check
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
